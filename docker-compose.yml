services:
  tekenmoment:
    build:
      context: .
      dockerfile: Dockerfile
    # Local image name only — not published to Docker Hub
    image: tekenmoment:local
    pull_policy: build
    container_name: tekenmoment
    restart: unless-stopped
    ports:
      # Host:container — open this host port on the NAS/firewall
      - "0.0.0.0:8080:80"
    labels:
      - com.portainer.stack=tekenmoment
