services:
  tekenmoment:
    # Requires a public GHCR package or Portainer login to ghcr.io
    image: ghcr.io/tomashanedoes/sketchmatch:latest
    pull_policy: always
    container_name: tekenmoment
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
    labels:
      - com.portainer.stack=tekenmoment
